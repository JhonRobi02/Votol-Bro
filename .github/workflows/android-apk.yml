name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository currently contains a malformed, partial Android tree.
      # Regenerate the platform from scratch so Flutter does not preserve it.
      - name: Regenerate clean Android platform
        run: |
          rm -rf android
          rm -rf lib/android
          flutter create --platforms=android --project-name votol_config --org com.jhonrobi.votol .

      - name: Enable Android USB host support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          feature = '    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if "android.hardware.usb.host" not in content:
              content = content.replace("<application", feature + "    <application", 1)
              path.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolConfig-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
