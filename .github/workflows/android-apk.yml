name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository currently contains a malformed, partial Android tree.
      # Regenerate the platform from scratch so Flutter does not preserve it.
      - name: Regenerate clean Android platform
        run: |
          rm -rf android
          rm -rf lib/android
          flutter create --platforms=android --project-name votol_config --org com.jhonrobi.votol .

      - name: Enable Android USB host support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          feature = '    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if "android.hardware.usb.host" not in content:
              content = content.replace("<application", feature + "    <application", 1)
              path.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      # usb_serial 0.5.2 still references JCenter, which is no longer supported
      # by the current Gradle runtime. Replace it with Maven Central in the
      # downloaded dependency before Gradle evaluates the plugin.
      - name: Patch legacy USB serial Android build configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob

          matches = glob.glob(str(Path.home() / ".pub-cache/hosted/pub.dev/usb_serial-*/android/build.gradle"))
          if not matches:
              raise SystemExit("No se encontró el build.gradle de usb_serial en la caché de Pub")
          for name in matches:
              path = Path(name)
              content = path.read_text()
              content = content.replace("jcenter()", "mavenCentral()")
              path.write_text(content)

          gradle_props = Path("android/gradle.properties")
          props = gradle_props.read_text()
          if "android.newDsl=" not in props:
              props += "\\n# Keep compatibility with the Flutter Gradle plugin while AGP 9 is used\\nandroid.newDsl=false\\n"
          else:
              import re
              props = re.sub(r"(?m)^android\\.newDsl=.*$", "android.newDsl=false", props)
          gradle_props.write_text(props)
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolConfig-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
