name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Regenerate the incomplete Android platform tree before building.
      - name: Regenerate clean Android platform
        run: |
          rm -rf android
          rm -rf lib/android
          flutter create --platforms=android --project-name votol_config --org com.jhonrobi.votol .

      - name: Generate Votol Bros launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          rsvg-convert -w 48 -h 48 assets/votol_bros_logo.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 assets/votol_bros_logo.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 assets/votol_bros_logo.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 assets/votol_bros_logo.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 assets/votol_bros_logo.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="votol_config"', 'android:label="Votol Bros"')
          s = s.replace('android:label="votol_config"', 'android:label="Votol Bros"')
          p.write_text(s)
          PY

      - name: Enable Android USB host support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          feature = '    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
          if "android.hardware.usb.host" not in content:
              content = content.replace("<application", feature + "    <application", 1)
              path.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      # usb_serial 0.5.2 targets API 33 and needs a newer compile SDK
      # because its AndroidX dependencies require API 34 or later.
      - name: Patch legacy USB serial Android build configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import re

          matches = glob.glob(str(Path.home() / ".pub-cache/hosted/pub.dev/usb_serial-*/android/build.gradle"))
          if not matches:
              raise SystemExit("No se encontró el build.gradle de usb_serial en la caché de Pub")
          for name in matches:
              path = Path(name)
              content = path.read_text()
              content = content.replace("jcenter()", "mavenCentral()")
              content = re.sub(r"compileSdkVersion\s+33", "compileSdkVersion 36", content)
              content = re.sub(r"compileSdk\s*=\s*33", "compileSdk = 36", content)
              path.write_text(content)
              if "compileSdkVersion 36" not in content and "compileSdk = 36" not in content:
                  raise SystemExit(f"No se pudo actualizar compileSdk en {path}")

          gradle_props = Path("android/gradle.properties")
          props = gradle_props.read_text()
          if "android.newDsl=" not in props:
              props += "\n# Keep compatibility with Flutter Gradle plugin\nandroid.newDsl=false\n"
          else:
              props = re.sub(r"(?m)^android\.newDsl=.*$", "android.newDsl=false", props)
          gradle_props.write_text(props)
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolConfig-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
